name: Generate Graphify Knowledge Graph

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  graphify:
    name: Build & Upload Knowledge Graph
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Graphify
        run: |
          python -m pip install --upgrade pip
          pip install "graphifyy[gemini]"

      - name: Generate Graphify Knowledge Graph
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY found - running full graphify pipeline..."
            graphify .
          else
            echo "No GEMINI_API_KEY secret found - running AST code-only extraction..."
            graphify . --code-only
          fi

      - name: Validate Generated Graph
        run: |
          if [ ! -s graphify-out/graph.json ]; then
            echo "ERROR: graphify-out/graph.json is missing or empty!"
            exit 1
          fi

      - name: Upload Graphify Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: graphify-out
          path: graphify-out/
          if-no-files-found: error
          retention-days: 30
